<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08090b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#08090b" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#08090b"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#fade)"/>

  <!-- Availability marker -->
  <circle cx="88" cy="103" r="5" fill="#4ade80"/>
  <text x="106" y="109" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19"
        fill="#99a1ac" letter-spacing="1.2">Open to AI/ML &amp; GenAI internships</text>

  <!-- Name -->
  <text x="80" y="252" font-family="Inter, Helvetica, Arial, sans-serif" font-size="92"
        font-weight="700" fill="#e9ebee" letter-spacing="-3">Himanshu Kumar</text>

  <!-- Role -->
  <text x="80" y="316" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" fill="#99a1ac">
    AI engineer · agentic systems, LLM infrastructure, developer tools
  </text>

  <!-- Rule -->
  <rect x="80" y="390" width="1040" height="1" fill="#ffffff" fill-opacity="0.1"/>

  <!-- Proof strip -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#6a727e" letter-spacing="1.6">
