    <text x="360" y="440">MERGED PRS</text>
    <text x="640" y="440">EVAL METRICS</text>
    <text x="920" y="440">FOUNDER</text>
  </g>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="600" fill="#e9ebee">
    <text x="80" y="492">7,000+</text>
    <text x="360" y="492">13+</text>
    <text x="640" y="492">18+</text>
    <text x="920" y="492" fill="#7c93ff">OpenAgentHQ</text>
  </g>

  <!-- Footer -->
